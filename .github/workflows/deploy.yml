name: deploy

# Deploys the LookupApi to Render ("Flipkart VMS Server2.0").
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   RENDER_API_KEY     Render API key      (render.com -> Account Settings -> API Keys)
#   RENDER_SERVICE_ID  id of the Render service "Flipkart VMS Server2.0"
#                      (visible in the dashboard URL https://dashboard.render.com/web/<id>,
#                       or via GET https://api.render.com/v1/services)
#   VMS_DATABASE_URL   PostgreSQL connection string (secret — never echo)
#   LOOKUP_API_KEY     shared API key for /api/* (secret — never echo)
#
# Secret values are pushed to Render via the API on every run and are never stored in
# this repo (render.yaml declares them with sync: false). The env-vars endpoint replaces
# only the listed keys, so non-secret vars from render.yaml are unaffected.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Render also auto-deploys this service on every push to main (enabled at
      # service creation), so this workflow is ONLY needed to sync env vars from
      # GitHub secrets. If RENDER_API_KEY is not configured yet, skip everything
      # without failing the run.
      - name: Check Render credentials
        id: creds
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RENDER_API_KEY not set — skipping env sync (Render auto-deploys on push anyway)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync all env vars to Render (idempotent)
        if: steps.creds.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VMS_DATABASE_URL: ${{ secrets.VMS_DATABASE_URL }}
          LOOKUP_API_KEY: ${{ secrets.LOOKUP_API_KEY }}
        # Build the JSON payload with python3 so secret values are escaped correctly.
        # --fail-with-body surfaces Render error details in the run log; values are
        # never printed (the payload is written to a file that is not echoed).
        run: |
          python3 - <<'PY' > env-vars.json
          import json, os
          vars_dict = {
              "VMS_DATABASE_READ_ONLY": "true",
              "VMS_DB_QUERY_TIMEOUT_MS": "2000",
              "VMS_LOOKUP_CACHE_SECONDS": "60",
              "DOTNET_GCConserveMemory": "1",
              "FS_SCHEMA_ORDERS": "public",
              "FS_ORDERS_TABLE": "oms_orders",
              "FS_COL_TRACKING": "tracking_norm",
              "FS_COL_SELLER": "channel_label",
              "FS_ITEMS_JSON_COLUMN": "items_json",
              "FS_SKU_MAP_TABLE": "sku_photos",
              "FS_COL_SKU": "sku",
              "FS_COL_SKU_NAME": "title",
              "FS_IMAGE_TABLE": "sku_photos",
              "FS_COL_IMAGE_URL": "image_url"
          }
          db_url = os.environ.get("VMS_DATABASE_URL", "").strip()
          if db_url:
              vars_dict["VMS_DATABASE_URL"] = db_url
          api_key = os.environ.get("LOOKUP_API_KEY", "").strip()
          if api_key:
              vars_dict["LOOKUP_API_KEY"] = api_key

          payload = [{"key": k, "value": v} for k, v in vars_dict.items()]
          print(json.dumps(payload))
          PY
          curl -sS --fail-with-body -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @env-vars.json
          rm -f env-vars.json

      - name: Trigger Render deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'
